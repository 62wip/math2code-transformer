name: baseline_plus_plus_longer
seed: 62

data:
  tokenized_dir: data/tokenized
  tokenizer_path: data/tokenized/tokenizer.json
  train_size: null
  val_size: null
  heavy_val_size: 128
  val_seed: 62

model:
  type: baseline++
  params:
    embedding_dim: 512
    num_encoder_layers: 5
    num_decoder_layers: 7
    num_heads: 8
    dim_glu: 1024
    dropout: 0.1
    max_seq_len: 1024

optimizer:
  type: AdamW
  params:
    lr: 0.0003
    weight_decay: 0.01

scheduler:
  type: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 0.00003
  warmup:
    steps: 5
    start_factor: 0.1

batching:
  max_tokens: 8192
  bucket_width: 18
  num_workers: 0

training:
  num_epochs: 2
  examples_per_mini_epoch: 100000
